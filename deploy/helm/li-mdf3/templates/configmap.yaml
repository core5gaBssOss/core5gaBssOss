apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-li-mdf3-config
  labels:
    app.kubernetes.io/name: li-mdf3
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/li-mdf3.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  li-mdf3.json: |
    {{- include "li-mdf3.config" . | nindent 4 }}
