apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-li-mdf3
  labels:
    app.kubernetes.io/name: li-mdf3
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: running more than one has not been verified for this NF in a cluster.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: li-mdf3
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: li-mdf3
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides (ADR-0513).
      enableServiceLinks: false
      containers:
        - name: li-mdf3
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: x1
              containerPort: 7811
              protocol: TCP
            - name: x3
              containerPort: 7812
              protocol: TCP
            - name: metrics
              containerPort: 9493
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/li-mdf3.json
              subPath: li-mdf3.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-li-mdf3-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "li-mdf3-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: li-mdf3/cert.pem
              - key: key.pem
                path: li-mdf3/key.pem
              # ADR-0514: this NF's own Valkey ACL password (redis_password_file).
              - key: valkey.password
                path: li-mdf3/valkey.password
