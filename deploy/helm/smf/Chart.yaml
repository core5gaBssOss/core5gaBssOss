apiVersion: v2
name: smf
description: >
  SMF (Session Management Function) -- TS 29.502 Nsmf_PDUSession /sm-contexts. Lab-grade Helm
  chart; see docs/DECISIONS.md for what "lab-grade" means here (in-memory SM context storage, no
  HA, no real UPF/PCF/UDM behind it). Config and certificates (ADR-0513): a ConfigMap from files/smf.json (generated by
  tools/lab/gen_helm_config.py) at /build/config, and the Secret smf-certs at /build/certs
  (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is named smf, as peers and the
  certificate expect. Datastores are not provisioned by this chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
