apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-tsctsf-config
  labels:
    app.kubernetes.io/name: tsctsf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/tsctsf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  tsctsf.json: |
    {{- include "tsctsf.config" . | nindent 4 }}
