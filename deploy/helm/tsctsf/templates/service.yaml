apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tsctsf
  labels:
    app.kubernetes.io/name: tsctsf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: tsctsf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7825
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9497
      targetPort: metrics
      protocol: TCP
