apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nwdaf-config
  labels:
    app.kubernetes.io/name: nwdaf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/nwdaf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  nwdaf.json: |
    {{- include "nwdaf.config" . | nindent 4 }}
