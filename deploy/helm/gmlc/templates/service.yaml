apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:gmlc) use.
  name: {{ .Values.service.name | default "gmlc" }}
  labels:
    app.kubernetes.io/name: gmlc
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: gmlc
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7794
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9482
      targetPort: metrics
      protocol: TCP
