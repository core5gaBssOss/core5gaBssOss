apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:nef) use.
  name: {{ .Values.service.name | default "nef" }}
  labels:
    app.kubernetes.io/name: nef
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: nef
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7790
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9478
      targetPort: metrics
      protocol: TCP
    # LI_X1 from the LI-ADMF (NEF IRI-POI).
    - name: li-x1
      port: 7815
      targetPort: li-x1
      protocol: TCP
