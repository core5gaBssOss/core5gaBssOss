apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nef-config
  labels:
    app.kubernetes.io/name: nef
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/nef.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  nef.json: |
    {{- include "nef.config" . | nindent 4 }}
