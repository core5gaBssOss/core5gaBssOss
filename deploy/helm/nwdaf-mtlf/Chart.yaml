apiVersion: v2
name: nwdaf-mtlf
description: >
  NWDAF (Network Data Analytics Function), the MTLF role: Nnwdaf_MLModelProvision and model
  training through the Python sidecar in the same image (ADR-0369); see nfs/nwdaf/src/mtlf.cpp.
  The NWDAF image and binary run with role mtlf, as compose's nwdaf-mtlf service does. Lab-grade
  Helm chart (REVIEW-5ae0ef1 DEP-03, ADR-0517). Config as ADR-0513: a ConfigMap from
  files/nwdaf-mtlf.json (generated by tools/lab/gen_helm_config.py) mounted as
  /build/config/nwdaf.json, the file the binary reads. Certificates: the NWDAF's own Secret
  nwdaf-certs (same NF, same identity; its certificate also names nwdaf-mtlf). Training output and
  the MLflow store on a PersistentVolumeClaim. The Service is named nwdaf-mtlf, as the AnLF's
  mtlf_base_url expects. It needs Valkey, Doris, the ADRF and the DCCF, which this chart does not
  provision (ADR-0517).
type: application
version: 0.1.0
appVersion: "0.1.0"
