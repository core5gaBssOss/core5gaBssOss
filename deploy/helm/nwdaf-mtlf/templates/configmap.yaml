apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nwdaf-mtlf-config
  labels:
    app.kubernetes.io/name: nwdaf-mtlf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/nwdaf-mtlf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from
  # the compose lab config, never edited by hand; set values `configOverrides` to change a key.
  nwdaf.json: |
    {{- include "nwdaf-mtlf.config" . | nindent 4 }}
