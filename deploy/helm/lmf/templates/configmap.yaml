apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-lmf-config
  labels:
    app.kubernetes.io/name: lmf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/lmf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  lmf.json: |
    {{- include "lmf.config" . | nindent 4 }}
