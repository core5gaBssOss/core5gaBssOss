apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:lmf) use.
  name: {{ .Values.service.name | default "lmf" }}
  labels:
    app.kubernetes.io/name: lmf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: lmf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7795
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9483
      targetPort: metrics
      protocol: TCP
