{{- $cfg := include "upf.config" . | fromJson }}
apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:upf) use.
  name: {{ .Values.service.name | default "upf" }}
  labels:
    app.kubernetes.io/name: upf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: upf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: {{ $cfg.port }}
      targetPort: sbi
      protocol: TCP
    - name: pfcp
      port: {{ $cfg.pfcp_bind_port }}
      targetPort: pfcp
      protocol: UDP
    - name: metrics
      port: 9471
      targetPort: metrics
      protocol: TCP
