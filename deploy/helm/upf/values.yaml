image:
  repository: 5gc-upf
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

# Capabilities the eBPF/XDP datapath needs (see Chart.yaml gap 3). Remove the block to run PFCP-only.
securityContext:
  capabilities:
    add: [NET_ADMIN, SYS_ADMIN, DAC_OVERRIDE, BPF, PERFMON]
  # ADR-0466: to let `ip netns add` mount, load deploy/apparmor/5gc-upf on every node and set
  # appArmorProfile: {type: Localhost, localhostProfile: 5gc-upf}. Default = runtime default:
  # left unset (ADR-0513), because an explicit RuntimeDefault makes the kubelet reject the pod on
  # a node without AppArmor, and the ReplicaSet then recreates it in a loop; on an AppArmor node
  # the runtime applies its default profile anyway.

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Overrides merged over the generated files/upf.json (tools/lab/gen_helm_config.py), e.g.
#   configOverrides: {nrf_base_url: "https://nrf.5gc.svc.cluster.local:7777"}
configOverrides: {}

certs:
  # Secret holding ca.crt, cert.pem, key.pem and nrf-jwt-public.pem; default "upf-certs".
  secretName: ""
