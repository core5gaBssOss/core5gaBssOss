apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-udsf-config
  labels:
    app.kubernetes.io/name: udsf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/udsf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  udsf.json: |
    {{- include "udsf.config" . | nindent 4 }}
