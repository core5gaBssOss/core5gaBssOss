apiVersion: v2
name: product-catalog
description: >
  TM Forum TMF620 Product Catalog Management; see bss/product-catalog/src/main.cpp. Lab-grade Helm chart (REVIEW-5ae0ef1 DEP-03, ADR-0516). Config and certificates as
  ADR-0513: a ConfigMap from files/product-catalog.json (generated by tools/lab/gen_helm_config.py) at
  /build/config, and the Secret product-catalog-certs at /build/certs (scripts/helm/lab-pki-secrets.sh for
  the lab PKI); the Service is named product-catalog, as peers and the certificate expect. It needs
  PostgreSQL (the charging database), which this chart does not provision (ADR-0516).
type: application
version: 0.1.0
appVersion: "0.1.0"
