apiVersion: v1
kind: Service
metadata:
  # The component's name: what every peer's config and its certificate (DNS:product-catalog) use.
  name: {{ .Values.service.name | default "product-catalog" }}
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # TMF620 Product Catalog Management.
    - name: api
      port: 7785
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 9473
      targetPort: metrics
      protocol: TCP
