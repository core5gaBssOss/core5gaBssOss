apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-product-catalog-config
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/product-catalog.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  product-catalog.json: |
    {{- include "product-catalog.config" . | nindent 4 }}
