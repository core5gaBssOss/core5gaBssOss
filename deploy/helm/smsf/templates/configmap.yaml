apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-smsf-config
  labels:
    app.kubernetes.io/name: smsf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/smsf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  smsf.json: |
    {{- include "smsf.config" . | nindent 4 }}
