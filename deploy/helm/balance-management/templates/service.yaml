apiVersion: v1
kind: Service
metadata:
  # The component's name: what every peer's config and its certificate (DNS:balance-management) use.
  name: {{ .Values.service.name | default "balance-management" }}
  labels:
    app.kubernetes.io/name: balance-management
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: balance-management
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # TMF654 Prepay Balance Management.
    - name: api
      port: 7786
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 9474
      targetPort: metrics
      protocol: TCP
