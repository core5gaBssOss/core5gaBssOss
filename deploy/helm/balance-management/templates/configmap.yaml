apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-balance-management-config
  labels:
    app.kubernetes.io/name: balance-management
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/balance-management.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  balance-management.json: |
    {{- include "balance-management.config" . | nindent 4 }}
