apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dccf-config
  labels:
    app.kubernetes.io/name: dccf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/dccf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  dccf.json: |
    {{- include "dccf.config" . | nindent 4 }}
