apiVersion: v2
name: nsacf
description: >
  NSACF (Network Slice Admission Control Function); services and their YAML sources:
  nfs/nsacf/src/main.cpp. Lab-grade Helm chart (REVIEW-5ae0ef1 DEP-03, ADR-0515). Config and
  certificates as ADR-0513: a ConfigMap from files/nsacf.json (generated by
  tools/lab/gen_helm_config.py) at /build/config, and the Secret nsacf-certs at /build/certs
  (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is named nsacf, as peers and the
  certificate expect. It needs no datastore.
type: application
version: 0.1.0
appVersion: "0.1.0"
