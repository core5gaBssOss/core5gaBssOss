apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:nsacf) use.
  name: {{ .Values.service.name | default "nsacf" }}
  labels:
    app.kubernetes.io/name: nsacf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: nsacf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7797
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9484
      targetPort: metrics
      protocol: TCP
