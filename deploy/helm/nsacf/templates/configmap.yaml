apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nsacf-config
  labels:
    app.kubernetes.io/name: nsacf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/nsacf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  nsacf.json: |
    {{- include "nsacf.config" . | nindent 4 }}
