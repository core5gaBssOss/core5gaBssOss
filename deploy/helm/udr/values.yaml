image:
  repository: 5gc-udr
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# P8 (ADR-0282): OFF by default. UDR is the one NF whose state is entirely in PostgreSQL and can
# therefore be scaled horizontally without changing behaviour -- see templates/hpa.yaml for why
# the other NFs do not get one. Off by default because a cluster without metrics-server would
# otherwise get an HPA that never scales and reports as unhealthy.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# Overrides merged over the generated files/udr.json (tools/lab/gen_helm_config.py), e.g.
#   configOverrides: {nrf_base_url: "https://nrf.5gc.svc.cluster.local:7777"}
configOverrides: {}

certs:
  # Secret holding ca.crt, cert.pem, key.pem and nrf-jwt-public.pem; default "udr-certs".
  secretName: ""
