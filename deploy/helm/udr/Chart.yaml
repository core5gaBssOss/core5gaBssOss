apiVersion: v2
name: udr
description: >
  UDR (Unified Data Repository) -- TS 29.505 Nudr_DataRepository context-data group
  (amf-3gpp-access AMF context, smf-registrations). Lab-grade Helm chart; see docs/DECISIONS.md
  for what "lab-grade" means here (in-memory storage, no HA, RFC 6902 JSON Patch on both
  resources). Config and certificates (ADR-0513): a ConfigMap from files/udr.json (generated by
  tools/lab/gen_helm_config.py) at /build/config, and the Secret udr-certs at /build/certs
  (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is named udr, as peers and the
  certificate expect. Datastores are not provisioned by this chart. Needs PostgreSQL (nfs/udr/schema.postgres.sql).
type: application
version: 0.1.0
appVersion: "0.1.0"
