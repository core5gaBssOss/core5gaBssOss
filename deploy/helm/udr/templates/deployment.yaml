apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-udr
  labels:
    app.kubernetes.io/name: udr
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: UDR's in-memory context storage (see docs/DECISIONS.md, nfs/udr/src/main.cpp's
  # file header) has no shared state across pods -- scaling this deployment would give each
  # replica a different, inconsistent view. Same rationale as nrf's/amf's/smf's/udm's charts.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: udr
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: udr
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides, so e.g. AANF_PORT=tcp://10.96.0.12:7824 would
      # replace the NF's own port setting.
      enableServiceLinks: false
      containers:
        - name: udr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sbi
              containerPort: 7781
              protocol: TCP
            - name: metrics
              containerPort: 9468
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/udr.json
              subPath: udr.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-udr-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "udr-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: udr/cert.pem
              - key: key.pem
                path: udr/key.pem
              - key: nrf-jwt-public.pem
                path: nrf-jwt/public.pem
