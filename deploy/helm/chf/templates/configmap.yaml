apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-chf-config
  labels:
    app.kubernetes.io/name: chf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/chf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  chf.json: |
    {{- include "chf.config" . | nindent 4 }}
