apiVersion: v2
name: chf
description: >
  CHF (Charging Function); services and their YAML sources: nfs/chf/src/main.cpp. Lab-grade Helm
  chart (REVIEW-5ae0ef1 DEP-03, ADR-0515). Config and certificates as ADR-0513: a ConfigMap from
  files/chf.json (generated by tools/lab/gen_helm_config.py) at /build/config, and the Secret
  chf-certs at /build/certs (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is
  named chf, as peers and the certificate expect. It needs Valkey, PostgreSQL (postgres-chf),
  Doris, the BSS product catalog and balance management, which this chart does not provision
  (DEP-03 note in ADR-0515).
type: application
version: 0.1.0
appVersion: "0.1.0"
