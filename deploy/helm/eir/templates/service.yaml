apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:eir) use.
  name: {{ .Values.service.name | default "eir" }}
  labels:
    app.kubernetes.io/name: eir
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: eir
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7792
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9480
      targetPort: metrics
      protocol: TCP
