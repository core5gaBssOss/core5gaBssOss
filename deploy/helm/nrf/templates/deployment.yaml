apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nrf
  labels:
    app.kubernetes.io/name: nrf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: NRF's in-memory registry (see docs/DECISIONS.md) has no shared state across
  # pods -- scaling this deployment would give each replica a different, inconsistent view of
  # registered NFs. Fine for a lab, not for anything beyond it; a real multi-replica NRF needs the
  # shared-data federation this build explicitly deferred (see nfs/nrf/src/main.cpp's file header).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nrf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: nrf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides, so e.g. AANF_PORT=tcp://10.96.0.12:7824 would
      # replace the NF's own port setting.
      enableServiceLinks: false
      containers:
        - name: nrf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image's entrypoint runs scripts/gen-lab-pki.sh first, which writes a CA into
          # /build/certs -- compose's pki-init volume. Here the certificates are the read-only
          # certs Secret (no CA key in it), so the binary is started directly.
          command: ["/build/nrf"]
          ports:
            - name: sbi
              containerPort: 7777
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/nrf.json
              subPath: nrf.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-nrf-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "nrf-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: nrf/cert.pem
              - key: key.pem
                path: nrf/key.pem
              - key: nrf-jwt-public.pem
                path: nrf-jwt/public.pem
              - key: nrf-jwt-private.pem
                path: nrf-jwt/private.pem
