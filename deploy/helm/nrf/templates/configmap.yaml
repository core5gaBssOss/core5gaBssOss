apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nrf-config
  labels:
    app.kubernetes.io/name: nrf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/nrf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  nrf.json: |
    {{- include "nrf.config" . | nindent 4 }}
