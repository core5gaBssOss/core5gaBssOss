apiVersion: v1
kind: Service
metadata:
  # The component's name: what every peer's config and its certificate (DNS:roaming-interconnect) use.
  name: {{ .Values.service.name | default "roaming-interconnect" }}
  labels:
    app.kubernetes.io/name: roaming-interconnect
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: roaming-interconnect
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # TMF651 Agreement Management.
    - name: api
      port: 7788
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 9476
      targetPort: metrics
      protocol: TCP
