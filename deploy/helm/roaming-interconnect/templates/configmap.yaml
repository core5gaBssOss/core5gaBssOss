apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-roaming-interconnect-config
  labels:
    app.kubernetes.io/name: roaming-interconnect
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/roaming-interconnect.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  roaming-interconnect.json: |
    {{- include "roaming-interconnect.config" . | nindent 4 }}
