apiVersion: v2
name: roaming-interconnect
description: >
  TM Forum TMF651 Agreement Management (interconnect agreements); see bss/roaming-interconnect/src/main.cpp. Lab-grade Helm chart (REVIEW-5ae0ef1 DEP-03, ADR-0516). Config and certificates as
  ADR-0513: a ConfigMap from files/roaming-interconnect.json (generated by tools/lab/gen_helm_config.py) at
  /build/config, and the Secret roaming-interconnect-certs at /build/certs (scripts/helm/lab-pki-secrets.sh for
  the lab PKI); the Service is named roaming-interconnect, as peers and the certificate expect. It needs
  PostgreSQL (the charging database), which this chart does not provision (ADR-0516).
type: application
version: 0.1.0
appVersion: "0.1.0"
