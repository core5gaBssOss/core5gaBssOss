apiVersion: v2
name: ausf
description: >
  AUSF (Authentication Server Function) -- TS 29.509 Nausf_UEAuthentication ue-authentications
  group (5G-AKA and EAP-AKA' for a normal UE). Lab-grade Helm chart; see docs/DECISIONS.md for
  what "lab-grade" means here (in-memory auth-context storage, no HA). Config and certificates (ADR-0513): a ConfigMap from files/ausf.json (generated by
  tools/lab/gen_helm_config.py) at /build/config, and the Secret ausf-certs at /build/certs
  (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is named ausf, as peers and the
  certificate expect. Datastores are not provisioned by this chart. Needs Valkey.
type: application
version: 0.1.0
appVersion: "0.1.0"
