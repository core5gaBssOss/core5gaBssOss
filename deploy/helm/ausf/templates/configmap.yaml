apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ausf-config
  labels:
    app.kubernetes.io/name: ausf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/ausf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  ausf.json: |
    {{- include "ausf.config" . | nindent 4 }}
