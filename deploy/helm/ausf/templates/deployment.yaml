apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ausf
  labels:
    app.kubernetes.io/name: ausf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: AUSF's in-memory auth-context storage (see docs/DECISIONS.md ADR-0027,
  # nfs/ausf/src/main.cpp's file header) has no shared state across pods -- scaling this
  # deployment would give each replica a different, inconsistent view. Same rationale as
  # nrf's/amf's/smf's/udm's/udr's charts.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ausf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: ausf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides, so e.g. AANF_PORT=tcp://10.96.0.12:7824 would
      # replace the NF's own port setting.
      enableServiceLinks: false
      containers:
        - name: ausf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sbi
              containerPort: 7782
              protocol: TCP
            - name: metrics
              containerPort: 9469
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/ausf.json
              subPath: ausf.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-ausf-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "ausf-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: ausf/cert.pem
              - key: key.pem
                path: ausf/key.pem
              # ADR-0514: this NF's own Valkey ACL password (redis_password_file).
              - key: valkey.password
                path: ausf/valkey.password
              - key: nrf-jwt-public.pem
                path: nrf-jwt/public.pem
