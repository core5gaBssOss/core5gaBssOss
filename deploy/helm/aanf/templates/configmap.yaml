apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-aanf-config
  labels:
    app.kubernetes.io/name: aanf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/aanf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  aanf.json: |
    {{- include "aanf.config" . | nindent 4 }}
