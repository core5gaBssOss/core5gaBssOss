apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-aanf
  labels:
    app.kubernetes.io/name: aanf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # AKMA contexts live in Valkey (ADR-0495), so replicas would share them; one for the lab.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aanf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: aanf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides, so e.g. AANF_PORT=tcp://10.96.0.12:7824 would
      # replace the NF's own port setting.
      enableServiceLinks: false
      containers:
        - name: aanf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sbi
              containerPort: 7824
              protocol: TCP
            - name: metrics
              containerPort: 9496
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/aanf.json
              subPath: aanf.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-aanf-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "aanf-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: aanf/cert.pem
              - key: key.pem
                path: aanf/key.pem
              # ADR-0514: this NF's own Valkey ACL password (redis_password_file).
              - key: valkey.password
                path: aanf/valkey.password
              # ADR-0514: the KEK that seals KAKMA at rest (kakma_kek_file default).
              - key: kakma.kek
                path: aanf/kakma.kek
              - key: nrf-jwt-public.pem
                path: nrf-jwt/public.pem
