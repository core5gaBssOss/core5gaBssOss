apiVersion: v2
name: pcf
description: >
  PCF (Policy Control Function) -- TS 29.507 Npcf_AMPolicyControl (individual AM Policy
  Association) and TS 29.512 Npcf_SMPolicyControl (individual SM Policy). Lab-grade Helm chart;
  see docs/DECISIONS.md for what "lab-grade" means here (in-memory policy storage, no HA, fixed
  default policy decisions -- no real UDR-backed subscriber data). Config and certificates (ADR-0513): a ConfigMap from files/pcf.json (generated by
  tools/lab/gen_helm_config.py) at /build/config, and the Secret pcf-certs at /build/certs
  (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is named pcf, as peers and the
  certificate expect. Datastores are not provisioned by this chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
