apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pcf-config
  labels:
    app.kubernetes.io/name: pcf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/pcf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  pcf.json: |
    {{- include "pcf.config" . | nindent 4 }}
