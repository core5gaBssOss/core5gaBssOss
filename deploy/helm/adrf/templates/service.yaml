apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:adrf) use.
  name: {{ .Values.service.name | default "adrf" }}
  labels:
    app.kubernetes.io/name: adrf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: adrf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7804
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9490
      targetPort: metrics
      protocol: TCP
