apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-adrf-config
  labels:
    app.kubernetes.io/name: adrf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/adrf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  adrf.json: |
    {{- include "adrf.config" . | nindent 4 }}
