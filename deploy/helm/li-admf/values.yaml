image:
  repository: 5gc-li-admf
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

# Set to the warrant store's connection URL (a dedicated PostgreSQL: warrants are durable legal
# records and LI functions sit in their own security domain, TS 33.127 5.6).
databaseUrl: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Overrides merged over the generated files/li-admf.json (tools/lab/gen_helm_config.py), e.g.
#   configOverrides: {nrf_base_url: "https://nrf.5gc.svc.cluster.local:7777"}
configOverrides: {}

certs:
  # Secret holding ca.crt, cert.pem, key.pem and nrf-jwt-public.pem; default "li-admf-certs".
  secretName: ""
