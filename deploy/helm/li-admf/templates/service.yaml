apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:li-admf) use.
  name: {{ .Values.service.name | default "li-admf" }}
  labels:
    app.kubernetes.io/name: li-admf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: li-admf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: hi1
      port: 7808
      targetPort: hi1
      protocol: TCP
    - name: metrics
      port: 9492
      targetPort: metrics
      protocol: TCP
