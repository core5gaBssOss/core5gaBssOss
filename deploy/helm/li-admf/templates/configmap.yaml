apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-li-admf-config
  labels:
    app.kubernetes.io/name: li-admf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/li-admf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  li-admf.json: |
    {{- include "li-admf.config" . | nindent 4 }}
