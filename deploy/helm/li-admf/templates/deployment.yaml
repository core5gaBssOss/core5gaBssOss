apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-li-admf
  labels:
    app.kubernetes.io/name: li-admf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Exactly one replica: the lifecycle reconcile loop (nfs/li-admf/src/lifecycle.cpp) has no leader
  # election, so two replicas would each provision every LI task onto the POIs/MDF2. All warrant
  # state is in PostgreSQL, so scaling out is possible once that is added -- it is not there yet.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: li-admf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: li-admf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides, so e.g. AANF_PORT=tcp://10.96.0.12:7824 would
      # replace the NF's own port setting.
      enableServiceLinks: false
      containers:
        - name: li-admf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.databaseUrl }}
          env:
            - name: LI_ADMF_DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
          {{- end }}
          ports:
            - name: hi1
              containerPort: 7808
              protocol: TCP
            - name: metrics
              containerPort: 9492
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/li-admf.json
              subPath: li-admf.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-li-admf-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "li-admf-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: li-admf/cert.pem
              - key: key.pem
                path: li-admf/key.pem
              - key: nrf-jwt-public.pem
                path: nrf-jwt/public.pem
