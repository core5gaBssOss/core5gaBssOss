apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nssf-config
  labels:
    app.kubernetes.io/name: nssf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/nssf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  nssf.json: |
    {{- include "nssf.config" . | nindent 4 }}
