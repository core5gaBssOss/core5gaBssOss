apiVersion: v2
name: amf
description: >
  AMF (Access and Mobility Management Function) -- TS 29.518 Namf_Communication. Lab-grade Helm
  chart; see docs/DECISIONS.md for what "lab-grade" means here (in-memory UE context/subscription
  storage, no HA). Config and certificates (ADR-0513): a ConfigMap from files/amf.json (generated by
  tools/lab/gen_helm_config.py) at /build/config, and the Secret amf-certs at /build/certs
  (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is named amf, as peers and the
  certificate expect. Datastores are not provisioned by this chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
