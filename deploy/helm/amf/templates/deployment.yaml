apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-amf
  labels:
    app.kubernetes.io/name: amf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: AMF's in-memory UE context/subscription storage (see docs/DECISIONS.md,
  # nfs/amf/src/main.cpp's file header) has no shared state across pods -- scaling this deployment
  # would give each replica a different, inconsistent view. Same rationale as nrf's chart.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: amf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides, so e.g. AANF_PORT=tcp://10.96.0.12:7824 would
      # replace the NF's own port setting.
      enableServiceLinks: false
      containers:
        - name: amf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The address AMF registers in the NRF and puts in its callback URIs: the pod IP, known
            # only at runtime (files/amf.json has no advertised_ipv4, so a missing value fails fast).
            - name: AMF_ADVERTISED_IPV4
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: sbi
              containerPort: 7778
              protocol: TCP
            - name: metrics
              containerPort: 9465
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/amf.json
              subPath: amf.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-amf-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "amf-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: amf/cert.pem
              - key: key.pem
                path: amf/key.pem
              # ADR-0514: this NF's own Valkey ACL password (redis_password_file).
              - key: valkey.password
                path: amf/valkey.password
              - key: nrf-jwt-public.pem
                path: nrf-jwt/public.pem
