apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:amf) use.
  name: {{ .Values.service.name | default "amf" }}
  labels:
    app.kubernetes.io/name: amf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: amf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7778
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9465
      targetPort: metrics
      protocol: TCP
