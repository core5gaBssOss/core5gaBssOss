apiVersion: v2
name: udm
description: >
  UDM (Unified Data Management) -- TS 29.503 Nudm_UECM (AMF/SMF registration groups) + Nudm_SDM
  (subscriber data retrieval, subscriptions). Lab-grade Helm chart; see docs/DECISIONS.md for what
  "lab-grade" means here (in-memory registration/subscription storage, no HA, no real UDR behind
  GetAmData/GetSmfSelData/GetSmData). Config and certificates (ADR-0513): a ConfigMap from files/udm.json (generated by
  tools/lab/gen_helm_config.py) at /build/config, and the Secret udm-certs at /build/certs
  (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is named udm, as peers and the
  certificate expect. Datastores are not provisioned by this chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
