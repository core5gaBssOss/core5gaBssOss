apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-udm-config
  labels:
    app.kubernetes.io/name: udm
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/udm.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  udm.json: |
    {{- include "udm.config" . | nindent 4 }}
