apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:udm) use.
  name: {{ .Values.service.name | default "udm" }}
  labels:
    app.kubernetes.io/name: udm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: udm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7780
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9467
      targetPort: metrics
      protocol: TCP
