apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bsf-config
  labels:
    app.kubernetes.io/name: bsf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/bsf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  bsf.json: |
    {{- include "bsf.config" . | nindent 4 }}
