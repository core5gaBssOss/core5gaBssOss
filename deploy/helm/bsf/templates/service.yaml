apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:bsf) use.
  name: {{ .Values.service.name | default "bsf" }}
  labels:
    app.kubernetes.io/name: bsf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: bsf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7789
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9477
      targetPort: metrics
      protocol: TCP
