apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mfaf-config
  labels:
    app.kubernetes.io/name: mfaf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/mfaf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  mfaf.json: |
    {{- include "mfaf.config" . | nindent 4 }}
