apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mfaf
  labels:
    app.kubernetes.io/name: mfaf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: running more than one has not been verified for this NF in a cluster.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mfaf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: mfaf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides (ADR-0513).
      enableServiceLinks: false
      containers:
        - name: mfaf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The address the NF registers in the NRF: the pod IP, known only at runtime
            # (files/mfaf.json has no advertised_ipv4, so a missing value fails fast).
            - name: MFAF_ADVERTISED_IPV4
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: sbi
              containerPort: 7800
              protocol: TCP
            - name: metrics
              containerPort: 9487
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/mfaf.json
              subPath: mfaf.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-mfaf-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "mfaf-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: mfaf/cert.pem
              - key: key.pem
                path: mfaf/key.pem
              # ADR-0514: this NF's own Valkey ACL password (redis_password_file).
              - key: valkey.password
                path: mfaf/valkey.password
              - key: nrf-jwt-public.pem
                path: nrf-jwt/public.pem
