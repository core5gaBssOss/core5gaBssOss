apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:mfaf) use.
  name: {{ .Values.service.name | default "mfaf" }}
  labels:
    app.kubernetes.io/name: mfaf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: mfaf
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7800
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9487
      targetPort: metrics
      protocol: TCP
