apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-subscriber-management-config
  labels:
    app.kubernetes.io/name: subscriber-management
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/subscriber-management.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  subscriber-management.json: |
    {{- include "subscriber-management.config" . | nindent 4 }}
