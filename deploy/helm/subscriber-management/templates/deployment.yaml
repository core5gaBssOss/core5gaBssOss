apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-subscriber-management
  labels:
    app.kubernetes.io/name: subscriber-management
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: running more than one has not been verified for this component in a cluster.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: subscriber-management
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: subscriber-management
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides (ADR-0513).
      enableServiceLinks: false
      containers:
        - name: subscriber-management
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 7787
              protocol: TCP
            - name: metrics
              containerPort: 9475
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/subscriber-management.json
              subPath: subscriber-management.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-subscriber-management-config
        # The component's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "subscriber-management-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: subscriber-management/cert.pem
              - key: key.pem
                path: subscriber-management/key.pem
