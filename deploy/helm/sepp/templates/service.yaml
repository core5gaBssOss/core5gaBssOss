apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:sepp) use.
  name: {{ .Values.service.name | default "sepp" }}
  labels:
    app.kubernetes.io/name: sepp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: sepp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7820
      targetPort: sbi
      protocol: TCP
    - name: n32
      port: 7821
      targetPort: n32
      protocol: TCP
    - name: metrics
      port: 9494
      targetPort: metrics
      protocol: TCP
