apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sepp
  labels:
    app.kubernetes.io/name: sepp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: the N32 contexts (ADR-0491) are held in memory, so a second replica would hold
  # none and refuse the partner's N32-f traffic with CONTEXT_NOT_FOUND.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sepp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: sepp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # No Kubernetes service-link variables: they are named <SERVICE>_PORT etc., the same names
      # as nf_config's <SERVICE>_<KEY> overrides, so e.g. AANF_PORT=tcp://10.96.0.12:7824 would
      # replace the NF's own port setting.
      enableServiceLinks: false
      containers:
        - name: sepp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sbi
              containerPort: 7820
              protocol: TCP
            - name: n32
              containerPort: 7821
              protocol: TCP
            - name: metrics
              containerPort: 9494
              protocol: TCP
          volumeMounts:
            # ADR-0453 in Helm: the image holds only the binary.
            - name: config
              mountPath: /build/config/sepp.json
              subPath: sepp.json
              readOnly: true
            - name: certs
              mountPath: /build/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-sepp-config
        # The NF's own TLS material only, laid out as CERTS_DIR expects. Create it with
        # scripts/helm/lab-pki-secrets.sh (lab PKI) or from your own CA with the same keys.
        - name: certs
          secret:
            secretName: {{ .Values.certs.secretName | default "sepp-certs" }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: cert.pem
                path: sepp/cert.pem
              - key: key.pem
                path: sepp/key.pem
              - key: nrf-jwt-public.pem
                path: nrf-jwt/public.pem
