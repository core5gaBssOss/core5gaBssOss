apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-provisioning-config
  labels:
    app.kubernetes.io/name: provisioning
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/provisioning.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  provisioning.json: |
    {{- include "provisioning.config" . | nindent 4 }}
