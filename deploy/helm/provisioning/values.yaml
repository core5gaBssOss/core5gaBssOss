image:
  repository: 5gc-provisioning
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Overrides merged over the generated files/provisioning.json (tools/lab/gen_helm_config.py), e.g.
#   configOverrides: {udr_base_url: "https://udr.5gc.svc.cluster.local:7781"}
configOverrides: {}

certs:
  # Secret holding ca.crt, cert.pem and key.pem; default "provisioning-certs".
  secretName: ""
