apiVersion: v2
name: provisioning
description: >
  Customer order-to-activation runner (ADR-0382): BSS SID chain, then the UDR OAM provisioning API; see bss/provisioning/src/main.cpp. Lab-grade Helm chart (REVIEW-5ae0ef1 DEP-03, ADR-0516). Config and certificates as
  ADR-0513: a ConfigMap from files/provisioning.json (generated by tools/lab/gen_helm_config.py) at
  /build/config, and the Secret provisioning-certs at /build/certs (scripts/helm/lab-pki-secrets.sh for
  the lab PKI); the Service is named provisioning, as peers and the certificate expect. It needs
  PostgreSQL (the orchestration and charging databases) and the UDR, which this chart does not provision (ADR-0516).
type: application
version: 0.1.0
appVersion: "0.1.0"
