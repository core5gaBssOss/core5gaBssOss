apiVersion: v2
name: li-mdf
description: >
  LI MDF2, the Mediation and Delivery Function for IRI (TS 33.127 5.3.4); see
  nfs/li-mdf/src/main.cpp. Lab-grade Helm chart (REVIEW-5ae0ef1 DEP-03, ADR-0515). Config and
  certificates as ADR-0513: a ConfigMap from files/li-mdf.json (generated by
  tools/lab/gen_helm_config.py) at /build/config, and the Secret li-mdf-certs at /build/certs
  (scripts/helm/lab-pki-secrets.sh for the lab PKI); the Service is named li-mdf, as peers and
  the certificate expect. It needs Valkey, and the LEMF it delivers HI2 to, which this chart does
  not provision (DEP-03 note in ADR-0515).
type: application
version: 0.1.0
appVersion: "0.1.0"
