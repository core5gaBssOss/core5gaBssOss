apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-li-mdf-config
  labels:
    app.kubernetes.io/name: li-mdf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/li-mdf.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  li-mdf.json: |
    {{- include "li-mdf.config" . | nindent 4 }}
