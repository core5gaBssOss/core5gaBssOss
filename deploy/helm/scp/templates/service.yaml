apiVersion: v1
kind: Service
metadata:
  # The NF's name: what every peer's config and the NF's certificate (DNS:scp) use.
  name: {{ .Values.service.name | default "scp" }}
  labels:
    app.kubernetes.io/name: scp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: scp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sbi
      port: 7791
      targetPort: sbi
      protocol: TCP
    - name: metrics
      port: 9479
      targetPort: metrics
      protocol: TCP
