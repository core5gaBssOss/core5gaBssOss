apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scp-config
  labels:
    app.kubernetes.io/name: scp
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # files/scp.json is generated by tools/lab/gen_helm_config.py (`make lab-config`) from the
  # compose lab config, never edited by hand; set values `configOverrides` to change a key.
  scp.json: |
    {{- include "scp.config" . | nindent 4 }}
