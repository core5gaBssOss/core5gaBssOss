name: CI Auto-Retry

# Real, disclosed mitigation (docs/DECISIONS.md ADR-0226) for the account-level GitHub runner
# reclaim pattern (ADR-0124/ADR-0163/ADR-0222/ADR-0225) that a step-local retry cannot survive:
# GitHub's own "shutdown signal" kills the entire step process (including any retry loop running
# inside it, confirmed directly -- ADR-0225's own step-local retry never reached a second attempt
# because the loop's own shell was what got killed), so recovery has to happen as a genuinely
# separate job/workflow run, launched fresh *after* the failure is already recorded rather than
# from inside the process that died.
#
# Watches the main CI workflow's own completion. If it failed, and it hasn't already been
# auto-retried past a small bound, reruns only the failed jobs via the GitHub CLI. Bounded to 3
# total attempts (`run_attempt < 3`) so a real, persistent failure (an actual bug, not external
# infra flakiness) still ends up red instead of retrying forever -- this is a mitigation for
# transient runner-infra issues, not a way to hide a genuine defect. `workflow_run` triggers always
# use the version of this file on the default branch, not the triggering commit's own version.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "CI run ${{ github.event.workflow_run.id }} failed on attempt ${{ github.event.workflow_run.run_attempt }} -- rerunning failed jobs (bounded to 3 total attempts, see ADR-0226)."
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
