name: Docs lint

# markdownlint on the front-page documents listed in .markdownlint-cli2.jsonc (ADR-0509). Runs on a
# GitHub-hosted runner, never the self-hosted one.
on:
  pull_request:
    paths: ["**.md", ".markdownlint-cli2.jsonc", ".github/workflows/docs-lint.yml"]
  push:
    branches: [main]
    paths: ["**.md", ".markdownlint-cli2.jsonc", ".github/workflows/docs-lint.yml"]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action lints *.{md,markdown} unless given globs, and ignores the config file's own
      # "globs" list, so the same list is repeated here. Keep the two in sync.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            README.md
            CHANGELOG.md
            .github/*.md
            docs/RELEASING.md
            specs/README.md
