name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  build:
    runs-on: ubuntu-latest
    # Real PostgreSQL for tests/integration/test_product_catalog_postgres.cpp (ADR-0054) -- without
    # this, that test's SetUp() finds no reachable Postgres and calls GTEST_SKIP() (a real,
    # disclosed local-dev fallback, not a CI behavior); this service makes CI actually exercise the
    # real DB path instead of skipping it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: product_catalog
          POSTGRES_PASSWORD: product_catalog
          POSTGRES_DB: product_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real PostgreSQL for tests/integration/test_subscriber_management_postgres.cpp and
      # test_roaming_interconnect_postgres.cpp (P4.7) -- same "one postgres per consumer" shape
      # docker-compose.yml already established for balance-management/chf (ADR-0056/ADR-0058).
      postgres-subscriber:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subscriber_management
          POSTGRES_PASSWORD: subscriber_management
          POSTGRES_DB: subscriber_management
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-roaming:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roaming_interconnect
          POSTGRES_PASSWORD: roaming_interconnect
          POSTGRES_DB: roaming_interconnect
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real PostgreSQL for tests/integration/test_udr_context_data.cpp (ADR-0068, gap-closure
      # Tier 1a) -- this test spawns the real udr binary, which now hard-requires PostgreSQL to
      # start at all (see nfs/udr/src/main.cpp's own database_conninfo() comment).
      postgres-udr:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: udr
          POSTGRES_PASSWORD: udr
          POSTGRES_DB: udr
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real CHF-in-CI. Real PostgreSQL for CHF's own E5 RatingDecision audit
      # (ADR-0060) -- port 5434 and POSTGRES_HOST_AUTH_METHOD=trust match
      # deploy/docker/docker-compose.yml's own already-established real postgres-chf service
      # exactly (same real conninfo CHF_RATING_DATABASE_URL below points at), not a new
      # convention invented for CI.
      postgres-chf:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: chf_rating
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real Redis/Valkey for CHF's own E3 session-state persistence (ADR-0055).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real ClickHouse for CHF's own CDR generation (ADR-0058). A real, non-empty
      # CLICKHOUSE_PASSWORD is required -- confirmed by direct live testing, not assumed: the
      # official image's own shipped users.d/default-user.xml restricts the `default` user to
      # 127.0.0.1/::1 only even with an explicit empty password set, so a genuinely different
      # container (this job's own steps, reaching it over the Docker bridge network) is rejected
      # regardless of password correctness -- same real finding and same real fix
      # deploy/docker/docker-compose.yml's own clickhouse service comment already documents.
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: chf_clickhouse_lab
          CLICKHOUSE_DB: default
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-bincache-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          # NOT --depth 1: vcpkg.json pins a specific historical builtin-baseline commit (not
          # necessarily vcpkg's current HEAD), and vcpkg.cmake's manifest install resolves it via
          # `git show <baseline-commit>:versions/baseline.json` inside this clone -- a shallow
          # clone only has the tip commit, so that `git show` fails with exit 128 the moment the
          # pinned baseline isn't HEAD (the normal case, not an edge case). Real bug this comment
          # documents: every CI run failed on exactly this until it was found and fixed.
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install Ninja
        # bison/flex: needed to build vcpkg's libpq port from source (ADR-0054 added libpqxx,
        # transitively libpq) -- real gap hit locally first (this sandbox had neither and no sudo
        # password to self-install), fixed here so CI doesn't hit the same wall.
        # postgresql-client: psql, used below to apply schema.sql to the postgres service before
        # running ctest.
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsctp-dev libbpf-dev libcap-dev clang-18 bison flex postgresql-client

      - name: Install sbi-codegen Python deps
        run: pip install -r tools/sbi-codegen/requirements.txt

      - name: Cache asn1c toolchain (libs/ngap-generated needs it, ADR-0030/ADR-0031)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build-tools/asn1c
          key: asn1c-${{ runner.os }}-${{ hashFiles('scripts/setup-asn1c.sh', 'scripts/patches/asn1c-aligned-per.patch') }}

      - name: Build asn1c toolchain (idempotent -- no-ops if the cache above already has it)
        run: ./scripts/setup-asn1c.sh

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Generate lab PKI (TLS 1.3 + mTLS certs for the integration test)
        # NOT the default arg-less invocation (nrf + hello-nf only, per the script's own default) --
        # tests/integration/* spawns real amf/smf/udm/udr/ausf/pcf processes too, each needing its
        # own real cert or it crashes on startup (real failure this project's CI hit and had never
        # caught before: local dev machines already had every NF's certs generated from countless
        # prior manual sessions, masking that CI's own from-scratch checkout never got them).
        run: ./scripts/gen-lab-pki.sh nrf hello-nf amf smf udm udr ausf pcf chf upf product-catalog subscriber-management roaming-interconnect

      - name: Apply product-catalog PostgreSQL schema (ADR-0054)
        run: PGPASSWORD=product_catalog psql -h localhost -U product_catalog -d product_catalog -f bss/product-catalog/schema.sql

      - name: Apply subscriber-management/roaming-interconnect PostgreSQL schemas (P4.7)
        run: |
          PGPASSWORD=subscriber_management psql -h localhost -p 5435 -U subscriber_management -d subscriber_management -f bss/subscriber-management/schema.sql
          PGPASSWORD=roaming_interconnect psql -h localhost -p 5436 -U roaming_interconnect -d roaming_interconnect -f bss/roaming-interconnect/schema.sql

      - name: Apply UDR PostgreSQL schema (ADR-0068)
        run: PGPASSWORD=udr psql -h localhost -p 5437 -U udr -d udr -f nfs/udr/schema.postgres.sql

      - name: Apply CHF PostgreSQL schema (ADR-0060)
        run: PGPASSWORD= psql -h localhost -p 5434 -U postgres -d chf_rating -f nfs/chf/schema.postgres.sql

      - name: Apply CHF ClickHouse schema (ADR-0058)
        # GitHub Actions service containers don't support the docker-compose-style
        # /docker-entrypoint-initdb.d/ auto-init volume mount (services start before checkout even
        # happens) -- applied explicitly via ClickHouse's own real HTTP interface instead, same
        # "explicit apply step" pattern the postgres schemas above already use for the identical
        # real reason.
        run: curl -sf -u default:chf_clickhouse_lab http://localhost:8123/ --data-binary @nfs/chf/schema.clickhouse.sql

      - name: Test
        # --timeout 120: defense in depth. A single spawned-NF-process crash/hang (real one hit
        # here: missing certs killed AMF on startup, which left ctest waiting its full default
        # timeout instead of failing fast, then every later test failed too from port contention
        # with the still-running orphaned processes) should fail in ~2 minutes, not 25.
        # TEST_POSTGRES_URL: points test_product_catalog_postgres.cpp at the real service above
        # instead of its local-dev default, so CI exercises the real DB path (ADR-0054) instead of
        # GTEST_SKIP()-ing it. TEST_SUBSCRIBER_MANAGEMENT_POSTGRES_URL/
        # TEST_ROAMING_INTERCONNECT_POSTGRES_URL do the same for P4.7's own two new store test
        # files. CHF_RATING_DATABASE_URL/CHF_REDIS_URL/CHF_CLICKHOUSE_* (ADR-0073) do the same for
        # CHF -- real conninfo values matching the services above, not CHF's own same-host-only
        # local-dev defaults (nfs/chf/src/main.cpp's own chf_rating_postgres_conninfo/
        # chf_redis_conninfo/chf_clickhouse_options comments).
        env:
          TEST_POSTGRES_URL: postgresql://product_catalog:product_catalog@localhost:5432/product_catalog
          TEST_SUBSCRIBER_MANAGEMENT_POSTGRES_URL: postgresql://subscriber_management:subscriber_management@localhost:5435/subscriber_management
          TEST_ROAMING_INTERCONNECT_POSTGRES_URL: postgresql://roaming_interconnect:roaming_interconnect@localhost:5436/roaming_interconnect
          UDR_DATABASE_URL: postgresql://udr:udr@localhost:5437/udr
          CHF_RATING_DATABASE_URL: postgresql://postgres@localhost:5434/chf_rating
          CHF_REDIS_URL: tcp://127.0.0.1:6379
          CHF_CLICKHOUSE_HOST: 127.0.0.1
          CHF_CLICKHOUSE_PORT: "9000"
          CHF_CLICKHOUSE_USER: default
          CHF_CLICKHOUSE_PASSWORD: chf_clickhouse_lab
          CHF_CLICKHOUSE_DATABASE: default
        run: ctest --test-dir build --output-on-failure --timeout 120

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [asan-ubsan, tsan]
    # See the build job's identical services block comment (ADR-0054/P4.7).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: product_catalog
          POSTGRES_PASSWORD: product_catalog
          POSTGRES_DB: product_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-subscriber:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subscriber_management
          POSTGRES_PASSWORD: subscriber_management
          POSTGRES_DB: subscriber_management
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-roaming:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roaming_interconnect
          POSTGRES_PASSWORD: roaming_interconnect
          POSTGRES_DB: roaming_interconnect
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real PostgreSQL for tests/integration/test_udr_context_data.cpp (ADR-0068, gap-closure
      # Tier 1a) -- this test spawns the real udr binary, which now hard-requires PostgreSQL to
      # start at all (see nfs/udr/src/main.cpp's own database_conninfo() comment).
      postgres-udr:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: udr
          POSTGRES_PASSWORD: udr
          POSTGRES_DB: udr
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real CHF-in-CI. Real PostgreSQL for CHF's own E5 RatingDecision audit
      # (ADR-0060) -- port 5434 and POSTGRES_HOST_AUTH_METHOD=trust match
      # deploy/docker/docker-compose.yml's own already-established real postgres-chf service
      # exactly (same real conninfo CHF_RATING_DATABASE_URL below points at), not a new
      # convention invented for CI.
      postgres-chf:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: chf_rating
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real Redis/Valkey for CHF's own E3 session-state persistence (ADR-0055).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real ClickHouse for CHF's own CDR generation (ADR-0058). A real, non-empty
      # CLICKHOUSE_PASSWORD is required -- confirmed by direct live testing, not assumed: the
      # official image's own shipped users.d/default-user.xml restricts the `default` user to
      # 127.0.0.1/::1 only even with an explicit empty password set, so a genuinely different
      # container (this job's own steps, reaching it over the Docker bridge network) is rejected
      # regardless of password correctness -- same real finding and same real fix
      # deploy/docker/docker-compose.yml's own clickhouse service comment already documents.
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: chf_clickhouse_lab
          CLICKHOUSE_DB: default
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-bincache-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install Ninja
        # bison/flex: needed to build vcpkg's libpq port from source (ADR-0054 added libpqxx,
        # transitively libpq) -- real gap hit locally first (this sandbox had neither and no sudo
        # password to self-install), fixed here so CI doesn't hit the same wall.
        # postgresql-client: psql, used below to apply schema.sql to the postgres service before
        # running ctest.
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsctp-dev libbpf-dev libcap-dev clang-18 bison flex postgresql-client

      - name: Install sbi-codegen Python deps
        run: pip install -r tools/sbi-codegen/requirements.txt

      - name: Cache asn1c toolchain (libs/ngap-generated needs it, ADR-0030/ADR-0031)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build-tools/asn1c
          key: asn1c-${{ runner.os }}-${{ hashFiles('scripts/setup-asn1c.sh', 'scripts/patches/asn1c-aligned-per.patch') }}

      - name: Build asn1c toolchain (idempotent -- no-ops if the cache above already has it)
        run: ./scripts/setup-asn1c.sh

      - name: Configure (ASan+UBSan)
        if: matrix.sanitizer == 'asan-ubsan'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug -D5GC_ENABLE_ASAN=ON

      - name: Configure (TSan)
        if: matrix.sanitizer == 'tsan'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug -D5GC_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build

      - name: Generate lab PKI (TLS 1.3 + mTLS certs for the integration test)
        # NOT the default arg-less invocation (nrf + hello-nf only, per the script's own default) --
        # tests/integration/* spawns real amf/smf/udm/udr/ausf/pcf processes too, each needing its
        # own real cert or it crashes on startup (real failure this project's CI hit and had never
        # caught before: local dev machines already had every NF's certs generated from countless
        # prior manual sessions, masking that CI's own from-scratch checkout never got them).
        run: ./scripts/gen-lab-pki.sh nrf hello-nf amf smf udm udr ausf pcf chf upf product-catalog subscriber-management roaming-interconnect

      - name: Apply product-catalog PostgreSQL schema (ADR-0054)
        run: PGPASSWORD=product_catalog psql -h localhost -U product_catalog -d product_catalog -f bss/product-catalog/schema.sql

      - name: Apply subscriber-management/roaming-interconnect PostgreSQL schemas (P4.7)
        run: |
          PGPASSWORD=subscriber_management psql -h localhost -p 5435 -U subscriber_management -d subscriber_management -f bss/subscriber-management/schema.sql
          PGPASSWORD=roaming_interconnect psql -h localhost -p 5436 -U roaming_interconnect -d roaming_interconnect -f bss/roaming-interconnect/schema.sql

      - name: Apply UDR PostgreSQL schema (ADR-0068)
        run: PGPASSWORD=udr psql -h localhost -p 5437 -U udr -d udr -f nfs/udr/schema.postgres.sql

      - name: Test
        # --timeout 120: defense in depth. A single spawned-NF-process crash/hang (real one hit
        # here: missing certs killed AMF on startup, which left ctest waiting its full default
        # timeout instead of failing fast, then every later test failed too from port contention
        # with the still-running orphaned processes) should fail in ~2 minutes, not 25.
        # TEST_POSTGRES_URL: points test_product_catalog_postgres.cpp at the real service above
        # instead of its local-dev default, so CI exercises the real DB path (ADR-0054) instead of
        # GTEST_SKIP()-ing it.
        env:
          TEST_POSTGRES_URL: postgresql://product_catalog:product_catalog@localhost:5432/product_catalog
          TEST_SUBSCRIBER_MANAGEMENT_POSTGRES_URL: postgresql://subscriber_management:subscriber_management@localhost:5435/subscriber_management
          TEST_ROAMING_INTERCONNECT_POSTGRES_URL: postgresql://roaming_interconnect:roaming_interconnect@localhost:5436/roaming_interconnect
          UDR_DATABASE_URL: postgresql://udr:udr@localhost:5437/udr
        run: ctest --test-dir build --output-on-failure --timeout 120

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang tooling
        # bison/flex: see the build/sanitize jobs' "Install Ninja" step comment -- same libpq
        # (ADR-0054) build-from-source requirement applies here too, since Configure below runs
        # for the whole project including bss/product-catalog.
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format-18 clang-tidy-18 ninja-build libsctp-dev libbpf-dev libcap-dev clang-18 bison flex

      - name: clang-format check
        run: |
          find libs nfs tests -name '*.hpp' -o -name '*.cpp' | xargs clang-format-18 --dry-run --Werror

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-bincache-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install sbi-codegen Python deps
        run: pip install -r tools/sbi-codegen/requirements.txt

      - name: Cache asn1c toolchain (libs/ngap-generated needs it, ADR-0030/ADR-0031)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build-tools/asn1c
          key: asn1c-${{ runner.os }}-${{ hashFiles('scripts/setup-asn1c.sh', 'scripts/patches/asn1c-aligned-per.patch') }}

      - name: Build asn1c toolchain (idempotent -- no-ops if the cache above already has it)
        run: ./scripts/setup-asn1c.sh

      - name: Configure (for compile_commands.json)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        run: |
          find libs nfs -name '*.cpp' | xargs clang-tidy-18 -p build
